# ============================================================
# Agent: GC Log Analyzer — Configuration
# Updated: 2025-07-14
# Reason: Adjusted thresholds and tuning parameters based on
#         full analysis of provided G1 GC log (Java 17, 1 GB heap).
# ============================================================

agent:
  name: "GC Log Analyzer"
  version: "1.1.0"
  description: >
    Analyzes JVM G1 garbage-collector logs, identifies performance
    bottlenecks, and generates actionable tuning recommendations.

# ----------------------------------------------------------------
# Analysis thresholds — values used when scanning GC log events
# Adjusted after observing real log: many pauses >> 50 ms, so
# default "warning" level raised to reflect practical G1 behaviour
# on a 1–4 GB heap.
# ----------------------------------------------------------------
analysis:
  pause_thresholds_ms:
    info:     30      # previously 20 — first-pass noise reduction
    warning:  80      # previously 50 — too many false positives at 50 ms
    critical: 150     # previously 100 — 100 ms is routinely breached on 1 GB heap
    emergency: 250    # new level — pauses >= 250 ms require immediate action

  mmu_violation_threshold_ms: 100   # report any violation of this window

  concurrent_mark_cycle_warning_ms:  400   # previously not set; cycles up to 782 ms seen
  concurrent_mark_cycle_critical_ms: 600

  humongous_region_warning_count:    5     # flag if humongous regions > 5 before GC
  humongous_region_critical_count:   15

  metaspace_growth_warning_mb:       40    # flag if metaspace grows > 40 MB over session
  old_region_steady_growth_check:    true  # detect monotonically growing old regions

  survivor_threshold_min_age:        3     # warn if desired survivor age < 3 (overflow risk)

# ----------------------------------------------------------------
# Tuning recommendations — applied/generated by the agent
# These reflect the findings from the analysed log.
# ----------------------------------------------------------------
tuning:
  # Heap — machine has 8.7 GB; 1 GB is the clear root cause
  heap:
    recommended_xms: "3g"          # was: 1g
    recommended_xmx: "3g"          # was: 1g
    rationale: >
      Live-set reaches 450–540 MB. With 1 GB heap, young-gen is squeezed,
      causing 70+ young pauses and repeated mixed-GC rounds. 3 GB gives
      3–4× headroom while staying well within machine memory.

  # Pause target — relax from 100 ms (never met) to achievable 150 ms
  pause_target:
    max_gc_pause_millis: 150        # was: ~100 (inferred from MMU window)
    rationale: >
      15+ MMU violations prove the 100 ms target is unachievable at 1 GB.
      Setting 150 ms allows G1 to widen young-gen and reduce
      evacuation frequency.

  # Concurrent threads — single thread is the marking bottleneck
  concurrency:
    conc_gc_threads: 2              # was: 1 (critical bottleneck)
    parallel_gc_threads: 4          # keep at CPU count
    rationale: >
      ConcGCThreads=1 caused concurrent mark cycles up to 782 ms.
      Raising to 2 on a 4-core host halves marking time while leaving
      2 cores for application throughput.

  # Initiating heap occupancy — start mixed GCs earlier
  ihop:
    initiating_heap_occupancy_percent: 30   # was: 45 (G1 default)
    rationale: >
      Old-gen grew monotonically between mixed-GC rounds. Starting
      concurrent marking at 30 % occupancy gives more time to mark
      before evacuation pressure peaks.

  # Region size — reduces humongous classification threshold
  region_size:
    g1_heap_region_size: "4m"       # was: 1m (auto-selected)
    rationale: >
      With 3 GB heap, 4 MB regions are appropriate (target ~2048 regions).
      Humongous threshold moves from 512 KB to 2 MB, eliminating most
      observed humongous allocations.

  # Metaspace cap — prevent unbounded growth
  metaspace:
    max_metaspace_size: "256m"      # was: unlimited
    rationale: >
      Metaspace grew from 13 MB to 55 MB in 624 s with two
      Metadata-GC-Threshold triggers. Capping at 256 MB prevents
      runaway growth in long-running deployments.

  # Explicit GC — suppress application/library System.gc() calls
  explicit_gc:
    disable_explicit_gc: true       # was: false (System.gc() fired at 6.133 s)
    rationale: >
      A full compacting GC (107 ms STW) was triggered by System.gc()
      at ~6 s. Disabling explicit GC eliminates this and any future
      library-initiated full collections.

  # Tenuring — reduce survivor overflow (age-1 dominance)
  tenuring:
    max_tenuring_threshold: 6       # was: 15 (de facto 1 due to overflow)
    target_survivor_ratio: 50       # keep default, but log warns if age-1 > 90%
    rationale: >
      Survivor threshold collapsed to 1 in many GC cycles, meaning all
      survivors were immediately promoted. Capping at 6 prevents
      over-long tenuring while allowing real long-lived objects to
      age normally.

# ----------------------------------------------------------------
# Recommended full JVM flags (generated output block)
# ----------------------------------------------------------------
recommended_jvm_flags: >
  -Xms3g
  -Xmx3g
  -XX:+UseG1GC
  -XX:MaxGCPauseMillis=150
  -XX:InitiatingHeapOccupancyPercent=30
  -XX:ConcGCThreads=2
  -XX:ParallelGCThreads=4
  -XX:G1HeapRegionSize=4m
  -XX:MaxMetaspaceSize=256m
  -XX:MaxTenuringThreshold=6
  -XX:+DisableExplicitGC
  -Xlog:gc*:file=/var/log/app/gc.log:time,level,tags:filecount=5,filesize=20m

# ----------------------------------------------------------------
# Observability — logging and profiling flags to add
# ----------------------------------------------------------------
observability:
  gc_log_flags: >
    -Xlog:gc*:file=/var/log/app/gc.log:time,level,tags:filecount=5,filesize=20m
  jfr_flags: >
    -XX:StartFlightRecording=duration=10m,filename=/tmp/app.jfr,settings=profile
  metrics:
    export_gc_pause_histogram: true
    export_allocation_rate: true
    export_metaspace_usage: true

# ----------------------------------------------------------------
# Reporting — how the agent formats its output
# ----------------------------------------------------------------
reporting:
  output_format: "markdown"
  include_frontmatter: true
  frontmatter_fields:
    - name
    - date
    - agent
    - model
    - input_file
    - jvm_version
    - gc_collector
    - confidence
  severity_levels:
    - critical
    - high
    - medium
    - low
  include_evidence_quotes: true
  include_recommended_flags: true
  include_expected_impact_table: true
